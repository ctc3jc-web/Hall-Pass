<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hall Pass Kiosk Station</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
    main { max-width: 650px; margin: 0 auto; }
    h1 { text-align: center; font-size: 28px; margin-bottom: 12px; color: #4dabf7; text-transform: uppercase; }
    
    .usb-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #1e1e1e; border: 2px solid #333; border-radius: 10px;
      padding: 10px 15px; margin-bottom: 15px;
    }
    .usb-status { font-weight: bold; font-size: 15px; }
    .usb-status.connected { color: #20c997; }
    .usb-status.disconnected { color: #dc3545; }
    .usb-btn {
      background: #0d6efd; border: none; color: white; font-weight: bold;
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .loc-btn {
      background: #1e1e1e; border: 3px solid #333; color: white;
      padding: 22px 10px; font-size: 20px; font-weight: bold;
      border-radius: 12px; text-align: center; cursor: pointer;
    }
    .loc-btn.active { background: #0d6efd; border-color: #6ea8fe; transform: scale(0.98); }
    
    .input-card {
      background: #1a1a1a; border: 2px solid #333; border-radius: 12px;
      padding: 18px; margin-bottom: 15px; text-align: center;
    }
    .input-card label { display: block; font-size: 14px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; }
    .input-group { display: flex; gap: 10px; }
    #manualIdInput {
      flex: 1; background: #2a2a2a; border: 2px solid #444; color: #fff;
      font-size: 24px; padding: 12px; border-radius: 8px; text-align: center; outline: none;
    }
    .submit-btn {
      background: #198754; border: none; color: white; font-size: 20px;
      font-weight: bold; padding: 0 25px; border-radius: 8px; cursor: pointer;
    }
    
    .status-card {
      background: #222; border-radius: 12px; padding: 20px;
      text-align: center; font-size: 19px; border: 2px solid #444; line-height: 1.4;
    }
    .status-card.success { border-color: #198754; background: #0f291e; }
    .status-card.error { border-color: #dc3545; background: #2c0b0e; }
  </style>
</head>
<body onclick="keepFocus()">

  <main>
    <h1>MR. CARNEAL - HALL PASS STATION</h1>

    <div class="usb-bar">
      <span id="usbStatus" class="usb-status disconnected">PRINTER: Disconnected</span>
      <button type="button" class="usb-btn" onclick="connectPrinter()">Connect Printer</button>
    </div>

    <div class="grid">
      <button type="button" class="loc-btn" onclick="selectLoc(this, 'Restroom')">Restroom</button>
      <button type="button" class="loc-btn" onclick="selectLoc(this, 'Attendance Office')">Attendance Office</button>
      <button type="button" class="loc-btn" onclick="selectLoc(this, 'Teacher\'s Room')">Teacher's Room</button>
      <button type="button" class="loc-btn" onclick="selectLoc(this, 'Main Office')">Main Office</button>
      <button type="button" class="loc-btn" onclick="selectLoc(this, 'Student Services')">Student Services</button>
      <button type="button" class="loc-btn" onclick="selectLoc(this, 'Library')">Library</button>
      <button type="button" class="loc-btn" onclick="selectLoc(this, 'Other')" style="grid-column: span 2;">Other</button>
    </div>

    <div class="input-card">
      <label for="manualIdInput">Scan Badge or Type Student ID</label>
      <div class="input-group">
        <input type="text" id="manualIdInput" placeholder="Scan Badge / Enter ID" autocomplete="off" autofocus>
        <button type="button" class="submit-btn" onclick="processPass()">SUBMIT</button>
      </div>
    </div>

    <div id="statusBox" class="status-card">
      1. Tap a Location Above<br>2. Scan Badge or Type ID &amp; Press Submit
    </div>
  </main>

  <script>
    // PASTE YOUR APPS SCRIPT EXEC URL HERE:
    const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

    let usbDevice = null;
    let endpointOut = null;
    let selectedLocation = "";

    function keepFocus() {
      const inputField = document.getElementById('manualIdInput');
      if (document.activeElement !== inputField) {
        inputField.focus();
      }
    }
    window.onload = keepFocus;

    // WEBUSB PRINTER LOGIC (Unfiltered so pop-up always appears)
    async function connectPrinter() {
      const statusElem = document.getElementById('usbStatus');
      try {
        usbDevice = await navigator.usb.requestDevice({ filters: [] });

        await usbDevice.open();
        await usbDevice.selectConfiguration(1);
        
        const interfaceObj = usbDevice.configuration.interfaces[0];
        await usbDevice.claimInterface(interfaceObj.interfaceNumber);
        
        endpointOut = interfaceObj.alternate.endpoints.find(e => e.direction === 'out');

        statusElem.className = "usb-status connected";
        statusElem.innerText = "PRINTER: Connected ✓";
      } catch (error) {
        console.error("USB Error:", error);
        statusElem.className = "usb-status disconnected";
        statusElem.innerText = "PRINTER: " + error.message;
      }
    }

    async function printPass(studentName, location, timeStr) {
      if (!usbDevice || !endpointOut) return;

      const ESC = '\x1B', GS = '\x1D';
      let passData = ESC + '@' + ESC + 'a\x01' + "MR. CARNEAL'S CLASSROOM\n";
      passData += "================================\n";
      passData += GS + '!\x11' + "HALL PASS\n" + GS + '!\x00';
      passData += "================================\n\n";
      passData += ESC + 'a\x00';
      passData += `STUDENT:  ${studentName}\n`;
      passData += `DEST:     ${location}\n`;
      passData += `ISSUED:   ${timeStr}\n\n`;
      passData += ESC + 'a\x01' + "--------------------------------\nValid for one-way return\n================================\n";
      passData += '\n\n\n\n' + GS + 'V\x41\x00';

      const encoder = new TextEncoder();
      await usbDevice.transferOut(endpointOut.endpointNumber, encoder.encode(passData));
    }

    function selectLoc(element, locName) {
      document.querySelectorAll('.loc-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      selectedLocation = locName;
      document.getElementById('statusBox').className = "status-card";
      document.getElementById('statusBox').innerHTML = `Selected Location: <b>${locName}</b><br>Scan Badge or Press Submit...`;
      keepFocus();
    }

    function processPass() {
      const inputField = document.getElementById('manualIdInput');
      let studentId = inputField.value.trim();

      if (!selectedLocation || !studentId) {
        document.getElementById('statusBox').className = "status-card error";
        document.getElementById('statusBox').innerText = "ERROR: Tap a location AND scan/type an ID!";
        return;
      }

      document.getElementById('statusBox').className = "status-card";
      document.getElementById('statusBox').innerText = "Processing & Printing...";

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ studentId: studentId, location: selectedLocation })
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === "success") {
          document.getElementById('statusBox').className = "status-card success";
          document.getElementById('statusBox').innerHTML = `PASS ISSUED & PRINTED!<br><b>${result.name}</b> → ${result.location}`;
          printPass(result.name, result.location, result.timestamp);
        } else {
          document.getElementById('statusBox').className = "status-card error";
          document.getElementById('statusBox').innerText = "ERROR: " + result.message;
        }

        inputField.value = '';
        setTimeout(() => {
          selectedLocation = "";
          document.querySelectorAll('.loc-btn').forEach(btn => btn.classList.remove('active'));
          document.getElementById('statusBox').className = "status-card";
          document.getElementById('statusBox').innerHTML = "1. Tap a Location Above<br>2. Scan Badge or Type ID &amp; Press Submit";
          keepFocus();
        }, 3000);
      })
      .catch(err => {
        document.getElementById('statusBox').className = "status-card error";
        document.getElementById('statusBox').innerText = "NETWORK ERROR: " + err.message;
      });
    }

    document.getElementById('manualIdInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') processPass();
    });
  </script>
</body>
</html>

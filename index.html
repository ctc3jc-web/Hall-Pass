<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hall Pass Kiosk v1.0.9</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    .kiosk-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 1vh 1vw;
      gap: 1vw;
    }

    .left-side {
      width: 70%;
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
    }

    .right-side {
      width: 30%;
      background: #181818;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 10vh;
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 0 16px;
    }

    .title-group { display: flex; align-items: center; gap: 12px; }
    h1 { font-size: 3.8vh; color: #4dabf7; text-transform: uppercase; white-space: nowrap; font-weight: 900; }
    
    .version-tag {
      font-size: 2vh;
      color: #aaa;
      background: #2a2a2a;
      border: 1px solid #555;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .usb-bar { display: flex; align-items: center; gap: 10px; }
    .usb-status { font-weight: bold; font-size: 2.2vh; }
    .usb-status.connected { color: #20c997; }
    .usb-status.disconnected { color: #dc3545; }
    .usb-btn { 
      background: #0d6efd; 
      border: none; 
      color: white; 
      font-weight: bold; 
      padding: 6px 14px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 2vh; 
    }

    /* SCREEN MANAGEMENT */
    .screen {
      display: none;
      flex-direction: column;
      gap: 1.5vh;
      height: 85vh;
    }
    .screen.active-screen {
      display: flex;
    }

    /* SCREEN 1: LANDING PAGE */
    .welcome-card {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 2vh 2vw;
      text-align: center;
    }
    .welcome-card h2 { font-size: 4.5vh; color: #ffc107; margin-bottom: 0.5vh; }
    .welcome-card p { font-size: 2.6vh; color: #ccc; }

    .action-choice-container {
      display: flex;
      gap: 1.5vw;
      flex: 1;
    }

    .choice-btn {
      flex: 1;
      border: 4px solid #444;
      border-radius: 12px;
      color: white;
      font-size: 4.5vh;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5vh;
      transition: all 0.2s ease;
    }
    .choice-btn.leave { background: #0d6efd; border-color: #6ea8fe; }
    .choice-btn.return { background: #198754; border-color: #75b798; }
    .choice-btn span { font-size: 2.6vh; font-weight: 600; opacity: 0.9; }

    .landing-bottom-bar {
      height: 12vh;
      display: flex;
      gap: 10px;
    }

    .reprint-btn {
      flex: 1;
      background: #ffc107;
      color: #000;
      border: none;
      font-size: 3vh;
      font-weight: 900;
      border-radius: 8px;
      cursor: pointer;
    }
    .reprint-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

    /* SCREEN 2: PROCESS PASS */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 8vh;
    }

    .back-btn {
      background: #6c757d;
      border: none;
      color: white;
      font-size: 2.6vh;
      font-weight: 900;
      padding: 0 20px;
      height: 100%;
      border-radius: 8px;
      cursor: pointer;
    }

    .mode-indicator {
      font-size: 3.5vh;
      font-weight: 900;
      color: #4dabf7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 1vh 1vw;
      height: 42vh;
    }

    .loc-btn {
      background: #1e1e1e;
      border: 3px solid #444;
      color: white;
      font-size: 3.2vh;
      font-weight: 900;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
    }

    .loc-btn.active {
      background: #0d6efd;
      border-color: #6ea8fe;
      box-shadow: 0 0 16px rgba(13, 110, 253, 0.8);
    }

    .input-card {
      height: 15vh;
      display: flex;
      gap: 10px;
    }

    #manualIdInput {
      flex: 1;
      background: #2a2a2a;
      border: 3px solid #555;
      color: #fff;
      font-size: 4.2vh;
      font-weight: bold;
      padding: 0 16px;
      border-radius: 8px;
      text-align: center;
      outline: none;
    }

    .temp-id-btn {
      background: #6f42c1;
      border: none;
      color: white;
      font-size: 2.8vh;
      font-weight: 900;
      padding: 0 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .submit-btn {
      background: #198754;
      border: none;
      color: white;
      font-size: 3.8vh;
      font-weight: 900;
      padding: 0 28px;
      border-radius: 8px;
      cursor: pointer;
    }

    .status-card {
      height: 12vh;
      background: #1e1e1e;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 3vh;
      font-weight: bold;
      border: 3px solid #444;
      padding: 0 12px;
    }
    .status-card.success { border-color: #198754; background: #0f291e; }
    .status-card.returned { border-color: #0dcaf0; background: #082d38; }
    .status-card.error { border-color: #dc3545; background: #2c0b0e; }

    /* RIGHT SIDE: ACTIVE QUEUE */
    .active-header {
      font-size: 3vh;
      color: #ffc107;
      font-weight: 900;
      text-transform: uppercase;
      padding-bottom: 8px;
      border-bottom: 3px solid #333;
      margin-bottom: 10px;
      text-align: center;
    }

    .active-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      max-height: 85vh;
      overflow-y: hidden;
    }

    .pass-chip {
      background: #2b2b2b;
      border: 3px solid #ffc107;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pass-chip .name { font-size: 2.8vh; font-weight: bold; color: #fff; }
    .pass-chip .details { font-size: 2.2vh; color: #ddd; display: flex; justify-content: space-between; font-weight: 600; }
  </style>
</head>
<body>

  <div class="kiosk-container">
    
    <!-- LEFT SIDE -->
    <div class="left-side">
      <header>
        <div class="title-group">
          <h1>MR. CARNEAL - HALL PASS</h1>
          <span class="version-tag">v1.0.9</span>
        </div>
        <div class="usb-bar">
          <span id="usbStatus" class="usb-status disconnected">PRINTER: Disconnected</span>
          <button type="button" class="usb-btn" onclick="connectPrinter()">Connect</button>
        </div>
      </header>

      <!-- SCREEN 1: LANDING PAGE -->
      <div id="screen1" class="screen active-screen">
        <div class="welcome-card">
          <h2>PLEASE SELECT AN OPTION BELOW</h2>
          <p>Touch a button to begin</p>
        </div>

        <div class="action-choice-container">
          <button type="button" class="choice-btn leave" onclick="goToPassScreen('LEAVE')">
            🚶‍♂️ LEAVING CLASS
            <span>Select destination &amp; scan badge</span>
          </button>
          
          <button type="button" class="choice-btn return" onclick="goToPassScreen('RETURN')">
            🏠 RETURNING / CHECK-IN
            <span>Scan badge to return</span>
          </button>
        </div>

        <div class="landing-bottom-bar">
          <button type="button" id="reprintBtn" class="reprint-btn" onclick="reprintLastPass()" disabled>
            🔄 REPRINT LAST PASS
          </button>
        </div>
      </div>

      <!-- SCREEN 2: PROCESS PASS -->
      <div id="screen2" class="screen">
        <div class="nav-bar">
          <button type="button" class="back-btn" onclick="goToLanding()">⬅ CANCEL / BACK</button>
          <div id="modeIndicator" class="mode-indicator">LEAVING CLASS</div>
        </div>

        <div id="locationGrid" class="grid">
          <div class="loc-btn" onclick="selectLoc(this, 'Restroom')">Restroom</div>
          <div class="loc-btn" onclick="selectLoc(this, 'Attendance Office')">Attendance</div>
          <div class="loc-btn" onclick="selectLoc(this, 'Teacher\'s Room')">Teacher Room</div>
          <div class="loc-btn" onclick="selectLoc(this, 'Main Office')">Main Office</div>
          <div class="loc-btn" onclick="selectLoc(this, 'Student Services')">Student Services</div>
          <div class="loc-btn" onclick="selectLoc(this, 'Library')">Library</div>
          <div class="loc-btn" onclick="selectLoc(this, 'Nurse')">Nurse</div>
          <div class="loc-btn" onclick="selectLoc(this, 'Other')">Other</div>
        </div>

        <div class="input-card">
          <input type="text" id="manualIdInput" placeholder="Scan Badge Here" autocomplete="off">
          <button type="button" class="temp-id-btn" onclick="handleTempId()">TEMP ID</button>
          <button type="button" class="submit-btn" onclick="processPass()">SUBMIT</button>
        </div>

        <div id="statusBox" class="status-card">
          Select Location &amp; Scan Badge
        </div>
      </div>

    </div>

    <!-- RIGHT SIDE: CURRENTLY OUT QUEUE -->
    <div class="right-side">
      <div class="active-header">CURRENTLY OUT (<span id="activeCount">0</span>/4)</div>
      <div id="activeList" class="active-list">
        <span style="color:#666; font-size:2.8vh; text-align:center; margin-top:20px;">No active passes</span>
      </div>
    </div>

  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxoznmjLIO7d_CLAvthSzToJEDyjcXhcdbxWEdinacJCKXJIRMd7867X5rhXUPNjs2bLQ/exec";

    let usbDevice = null;
    let endpointOut = null;
    let currentMode = "LEAVE";
    let selectedLocation = "";
    let activePasses = [];
    let lastPrintedPass = null;

    function cleanId(idStr) {
      if (!idStr) return "";
      return String(idStr).trim().replace(/^0+/, '');
    }

    function keepFocus() {
      const inputField = document.getElementById('manualIdInput');
      if (inputField && document.getElementById('screen2').classList.contains('active-screen')) {
        inputField.focus();
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      autoConnectPrinter();
      fetchActivePassesFromSheet();
      setInterval(fetchActivePassesFromSheet, 2000); // 2-second live sync
    });

    function goToPassScreen(mode) {
      currentMode = mode;
      selectedLocation = "";
      document.querySelectorAll('.loc-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById('screen1').classList.remove('active-screen');
      document.getElementById('screen2').classList.add('active-screen');

      const grid = document.getElementById('locationGrid');
      const indicator = document.getElementById('modeIndicator');
      const statusBox = document.getElementById('statusBox');

      if (mode === "LEAVE") {
        indicator.innerText = "🚶‍♂️ LEAVING CLASS";
        indicator.style.color = "#0d6efd";
        grid.style.display = "grid";
        statusBox.innerText = "Select Location & Scan Badge";
      } else {
        indicator.innerText = "🏠 RETURNING TO CLASS";
        indicator.style.color = "#198754";
        grid.style.display = "none";
        statusBox.innerText = "Scan Badge to Return";
      }

      keepFocus();
    }

    function goToLanding() {
      document.getElementById('screen2').classList.remove('active-screen');
      document.getElementById('screen1').classList.add('active-screen');
      document.getElementById('manualIdInput').value = '';
      selectedLocation = "";
    }

    function fetchActivePassesFromSheet() {
      fetch(APPS_SCRIPT_URL + "?action=GET_ACTIVE")
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          activePasses = data.activePasses;
          renderActivePasses();

          // Check if any pass was issued remotely from Teacher Dashboard needing a print job
          data.activePasses.forEach(p => {
            if (p.printPending) {
              printPass(p.name, p.location, p.time);
              // Clear flag on server
              fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "CLEAR_PRINT_FLAG", rowId: p.rowId })
              });
            }
          });
        }
      })
      .catch(err => console.error("Sync error:", err));
    }

    async function autoConnectPrinter() {
      try {
        const devices = await navigator.usb.getDevices();
        if (devices.length > 0) {
          usbDevice = devices[0];
          await initializePrinter(usbDevice);
        }
      } catch (error) {}
    }

    async function connectPrinter() {
      const statusElem = document.getElementById('usbStatus');
      try {
        usbDevice = await navigator.usb.requestDevice({ filters: [] });
        await initializePrinter(usbDevice);
      } catch (error) {
        statusElem.className = "usb-status disconnected";
        statusElem.innerText = "PRINTER: " + error.message;
      }
    }

    async function initializePrinter(device) {
      const statusElem = document.getElementById('usbStatus');
      await device.open();
      if (device.configuration === null) await device.selectConfiguration(1);
      
      try { await device.claimInterface(0); } catch (err) {
        try { await device.releaseInterface(0); } catch(e){}
        await device.claimInterface(0);
      }

      const interfaces = device.configuration.interfaces;
      for (let iface of interfaces) {
        for (let alternate of iface.alternates) {
          let outEp = alternate.endpoints.find(e => e.direction === 'out');
          if (outEp) { endpointOut = outEp; break; }
        }
      }

      statusElem.className = "usb-status connected";
      statusElem.innerText = "PRINTER: Connected ✓";
    }

    async function printPass(studentName, location, timeStr) {
      if (!usbDevice || !endpointOut) return;

      const dateStr = new Date().toLocaleDateString('en-US');
      const ESC = '\x1B', GS = '\x1D';

      let passData = "";
      passData += ESC + '@' + ESC + '3\x18';
      passData += ESC + 'a\x01' + "MR. CARNEAL'S CLASSROOM\n";
      passData += "--------------------------------\n";
      passData += GS + '!\x11' + "HALL PASS\n" + GS + '!\x00';
      passData += "--------------------------------\n";
      passData += ESC + 'a\x00';
      passData += `STUDENT: ${studentName}\n`;
      passData += `DEST:    ${location}\n`;
      passData += `DATE:    ${dateStr}\n`;
      passData += `TIME:    ${timeStr}\n`;
      passData += ESC + 'a\x01' + "--------------------------------\n";
      passData += '\n\n' + GS + 'V\x41\x00';

      const encoder = new TextEncoder();
      try {
        await usbDevice.transferOut(endpointOut.endpointNumber, encoder.encode(passData));
      } catch (err) {}
    }

    function reprintLastPass() {
      if (!lastPrintedPass) return;
      printPass(lastPrintedPass.name, lastPrintedPass.location, lastPrintedPass.timestamp);
      alert(`Reprinted pass for ${lastPrintedPass.name}`);
    }

    function selectLoc(element, locName) {
      if (activePasses.length >= 4) {
        showError("LIMIT REACHED: Maximum 4 students out!");
        return;
      }

      if (locName === "Restroom") {
        const restroomCount = activePasses.filter(p => p.location === "Restroom").length;
        if (restroomCount >= 2) {
          showError("LIMIT REACHED: Maximum 2 Bathroom passes!");
          return;
        }
      }

      document.querySelectorAll('.loc-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      selectedLocation = locName;
      document.getElementById('statusBox').className = "status-card";
      document.getElementById('statusBox').innerHTML = `Location: <b>${locName}</b> &nbsp;|&nbsp; Scan Badge to Leave`;
      keepFocus();
    }

    function renderActivePasses() {
      const listElem = document.getElementById('activeList');
      const countElem = document.getElementById('activeCount');
      
      countElem.innerText = activePasses.length;

      if (activePasses.length === 0) {
        listElem.innerHTML = `<span style="color:#666; font-size:2.8vh; text-align:center; margin-top:20px;">No active passes</span>`;
        return;
      }

      listElem.innerHTML = activePasses.map(p => `
        <div class="pass-chip">
          <div class="name">${p.name}</div>
          <div class="details">
            <span>${p.location}</span>
            <span>${p.time}</span>
          </div>
        </div>
      `).join('');
    }

    function handleTempId() {
      const studentName = prompt("Enter Student's First and Last Name:");
      if (!studentName || !studentName.trim()) return;

      const tempId = "TEMP-" + Date.now().toString().slice(-6);
      executePassTransaction(tempId, studentName.trim());
    }

    function processPass() {
      const inputField = document.getElementById('manualIdInput');
      let rawId = inputField.value.trim();
      if (!rawId) return;

      executePassTransaction(cleanId(rawId), null);
    }

    function executePassTransaction(studentId, customName) {
      const inputField = document.getElementById('manualIdInput');

      if (currentMode === "LEAVE") {
        if (!selectedLocation) {
          showError("ERROR: Tap a location first!");
          return;
        }
        if (activePasses.length >= 4) {
          showError("LIMIT REACHED: Maximum 4 passes allowed!");
          return;
        }
        if (selectedLocation === "Restroom") {
          const restroomCount = activePasses.filter(p => p.location === "Restroom").length;
          if (restroomCount >= 2) {
            showError("LIMIT REACHED: Maximum 2 Bathroom passes!");
            return;
          }
        }
      }

      document.getElementById('statusBox').className = "status-card";
      document.getElementById('statusBox').innerText = "Communicating with server...";

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ 
          mode: currentMode,
          studentId: studentId, 
          location: selectedLocation,
          customName: customName 
        })
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === "success") {
          if (result.action === "ISSUED") {
            document.getElementById('statusBox').className = "status-card success";
            document.getElementById('statusBox').innerHTML = `PASS ISSUED! <b>${result.name}</b> → ${result.location}`;
            lastPrintedPass = { name: result.name, location: result.location, timestamp: result.timestamp };
            document.getElementById('reprintBtn').disabled = false;
            printPass(result.name, result.location, result.timestamp);
          } 
          else if (result.action === "RETURNED") {
            document.getElementById('statusBox').className = "status-card returned";
            document.getElementById('statusBox').innerHTML = `WELCOME BACK! <b>${result.name}</b> checked in.`;
          }

          fetchActivePassesFromSheet();
        } else {
          showError("ERROR: " + result.message);
        }

        inputField.value = '';
        selectedLocation = "";

        setTimeout(() => { goToLanding(); }, 2500);
      })
      .catch(err => { showError("NETWORK ERROR: " + err.message); });
    }

    function showError(msg) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = "status-card error";
      statusBox.innerText = msg;
      setTimeout(() => {
        statusBox.className = "status-card";
        statusBox.innerText = currentMode === "LEAVE" ? "Select Location & Scan Badge" : "Scan Badge to Return";
        keepFocus();
      }, 3500);
    }

    document.getElementById('manualIdInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') processPass();
    });
  </script>
</body>
</html>

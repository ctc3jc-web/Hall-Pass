<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hall Pass Kiosk v1.1.3</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    .kiosk-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 0.8vh 1vw;
      gap: 1vw;
    }

    .left-side {
      width: 70%;
      display: flex;
      flex-direction: column;
      gap: 1vh;
    }

    .right-side {
      width: 30%;
      background: #181818;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 10vh;
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 0 16px;
    }

    .title-group { display: flex; align-items: center; gap: 12px; }
    h1 { font-size: 3.8vh; color: #4dabf7; text-transform: uppercase; white-space: nowrap; font-weight: 900; }
    
    .version-tag {
      font-size: 2vh;
      color: #aaa;
      background: #2a2a2a;
      border: 1px solid #555;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .usb-bar { display: flex; align-items: center; gap: 10px; }
    .usb-status { font-weight: bold; font-size: 2.2vh; }
    .usb-status.connected { color: #20c997; }
    .usb-status.disconnected { color: #dc3545; }
    .usb-btn { 
      background: #0d6efd; 
      border: none; 
      color: white; 
      font-weight: bold; 
      padding: 6px 14px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 2vh; 
    }

    /* LOCATION GRID (2x4) */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 1vh 1vw;
      height: 48vh;
    }

    .loc-btn {
      background: #1e1e1e;
      border: 3px solid #444;
      color: white;
      font-size: 3.5vh;
      font-weight: 900;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .loc-btn.active {
      background: #0d6efd;
      border-color: #6ea8fe;
      box-shadow: 0 0 16px rgba(13, 110, 253, 0.8);
    }

    /* INPUT ROW WITH SUBMIT & CLEAR BUTTONS */
    .input-card {
      height: 14vh;
      display: flex;
      gap: 8px;
    }

    #manualIdInput {
      flex: 1;
      background: #2a2a2a;
      border: 3px solid #555;
      color: #fff;
      font-size: 4.2vh;
      font-weight: bold;
      padding: 0 16px;
      border-radius: 8px;
      text-align: center;
      outline: none;
    }

    .submit-btn {
      background: #198754;
      border: none;
      color: white;
      font-size: 3.2vh;
      font-weight: 900;
      padding: 0 22px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .clear-btn {
      background: #dc3545;
      border: none;
      color: white;
      font-size: 2.8vh;
      font-weight: 900;
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .temp-id-btn {
      background: #6f42c1;
      border: none;
      color: white;
      font-size: 2.8vh;
      font-weight: 900;
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-row {
      display: flex;
      gap: 10px;
      height: 14vh;
    }

    .status-card {
      flex: 1;
      background: #1e1e1e;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 3vh;
      font-weight: bold;
      border: 3px solid #444;
      padding: 0 12px;
    }
    .status-card.success { border-color: #198754; background: #0f291e; }
    .status-card.returned { border-color: #0dcaf0; background: #082d38; }
    .status-card.error { border-color: #dc3545; background: #2c0b0e; }

    .reprint-btn {
      background: #ffc107;
      color: #000;
      border: none;
      font-size: 2.6vh;
      font-weight: 900;
      padding: 0 18px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .reprint-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

    /* RIGHT SIDE: CLICKABLE QUEUE FOR REPRINTING */
    .active-header {
      font-size: 3vh;
      color: #ffc107;
      font-weight: 900;
      text-transform: uppercase;
      padding-bottom: 8px;
      border-bottom: 3px solid #333;
      margin-bottom: 10px;
      text-align: center;
    }

    .active-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      max-height: 85vh;
      overflow-y: hidden;
    }

    .pass-chip {
      background: #2b2b2b;
      border: 3px solid #ffc107;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.1s ease;
      user-select: none;
    }
    .pass-chip:active {
      transform: scale(0.98);
      border-color: #ffffff;
    }

    .pass-chip .name { font-size: 2.8vh; font-weight: bold; color: #fff; }
    .pass-chip .details { font-size: 2.2vh; color: #ddd; display: flex; justify-content: space-between; font-weight: 600; }
    .pass-chip .reprint-hint { font-size: 1.8vh; color: #ffc107; text-align: right; font-weight: 700; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="kiosk-container">
    
    <div class="left-side">
      <header>
        <div class="title-group">
          <h1>MR. CARNEAL - HALL PASS</h1>
          <span class="version-tag">v1.1.3</span>
        </div>
        <div class="usb-bar">
          <span id="usbStatus" class="usb-status disconnected">PRINTER: Disconnected</span>
          <button type="button" class="usb-btn" onclick="connectPrinter()">Connect</button>
        </div>
      </header>

      <div class="grid">
        <div class="loc-btn" onclick="selectLoc(this, 'Restroom')">Restroom</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Attendance Office')">Attendance Office</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Teacher\'s Room')">Teacher Room</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Main Office')">Main Office</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Student Services')">Student Services</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Library')">Library</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Nurse')">Nurse</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Other')">Other</div>
      </div>

      <div class="input-card">
        <input type="text" id="manualIdInput" placeholder="Scan Badge to Leave or Return" autocomplete="off" autofocus>
        <button type="button" class="submit-btn" onclick="processPass()">SUBMIT</button>
        <button type="button" class="clear-btn" onclick="clearForm()">CLEAR</button>
        <button type="button" class="temp-id-btn" onclick="handleTempId()">TEMP ID</button>
      </div>

      <div class="action-row">
        <div id="statusBox" class="status-card">
          1. Tap Location &amp; Scan Badge &nbsp;|&nbsp; 2. Scan Again to Return
        </div>
        <button type="button" id="reprintBtn" class="reprint-btn" onclick="reprintLastPass()" disabled>
          🔄 REPRINT PASS
        </button>
      </div>
    </div>

    <div class="right-side">
      <div class="active-header">CURRENTLY OUT (<span id="activeCount">0</span>/4)</div>
      <div id="activeList" class="active-list">
        <span style="color:#666; font-size:2.8vh; text-align:center; margin-top:20px;">No active passes</span>
      </div>
    </div>

  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyWLWQ_55UX7Ky5_RmZU3xqC7iNQ5N5JoY6DqqTTJyewg8o-SwzmShcc1pX0d_Oq6S7rA/exec";

    let usbDevice = null;
    let endpointOut = null;
    let interfaceNumber = 0;
    let selectedLocation = "";
    let activePasses = [];
    let lastPrintedPass = null;
    let isFetching = false;

    function cleanId(idStr) {
      if (!idStr) return "";
      return String(idStr).trim().replace(/^0+/, '');
    }

    function keepFocus() {
      const inputField = document.getElementById('manualIdInput');
      if (inputField && document.activeElement !== inputField) {
        inputField.focus();
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      keepFocus();
      autoConnectPrinter();
      fetchActivePassesFromSheet();
      setInterval(fetchActivePassesFromSheet, 1500);
      
      document.body.addEventListener('click', (e) => {
        if (!e.target.closest('.pass-chip') && !e.target.closest('button')) {
          keepFocus();
        }
      });
    });

    function clearForm() {
      document.getElementById('manualIdInput').value = '';
      selectedLocation = "";
      document.querySelectorAll('.loc-btn').forEach(btn => btn.classList.remove('active'));
      resetStatusBox();
    }

    function fetchActivePassesFromSheet() {
      if (isFetching) return;
      isFetching = true;

      fetch(APPS_SCRIPT_URL + "?action=GET_ACTIVE")
      .then(res => res.json())
      .then(data => {
        isFetching = false;
        if (data.status === "success") {
          activePasses = data.activePasses;
          renderActivePasses();

          data.activePasses.forEach(p => {
            if (p.printPending) {
              printPass(p.name, p.location, p.time);
              fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "CLEAR_PRINT_FLAG", rowId: p.rowId })
              });
            }
          });
        }
      })
      .catch(err => {
        isFetching = false;
        console.error("Sync error:", err);
      });
    }

    async function autoConnectPrinter() {
      try {
        const devices = await navigator.usb.getDevices();
        if (devices.length > 0) {
          usbDevice = devices[0];
          await initializePrinter(usbDevice);
        }
      } catch (error) {}
    }

    async function connectPrinter() {
      const statusElem = document.getElementById('usbStatus');
      try {
        usbDevice = await navigator.usb.requestDevice({ filters: [] });
        await initializePrinter(usbDevice);
      } catch (error) {
        statusElem.className = "usb-status disconnected";
        statusElem.innerText = "PRINTER: " + error.message;
      }
    }

    async function initializePrinter(device) {
      const statusElem = document.getElementById('usbStatus');
      try {
        if (!device.opened) await device.open();
        if (device.configuration === null) await device.selectConfiguration(1);
        
        const interfaces = device.configuration.interfaces;
        for (let iface of interfaces) {
          for (let alternate of iface.alternates) {
            let outEp = alternate.endpoints.find(e => e.direction === 'out');
            if (outEp) { 
              endpointOut = outEp; 
              interfaceNumber = iface.interfaceNumber;
              break; 
            }
          }
        }

        try { await device.claimInterface(interfaceNumber); } catch(e){}

        statusElem.className = "usb-status connected";
        statusElem.innerText = "PRINTER: Connected ✓";
      } catch (err) {
        statusElem.className = "usb-status disconnected";
        statusElem.innerText = "PRINTER: Connection Failed";
      }
    }

    async function printPass(studentName, location, timeStr) {
      if (!usbDevice || !endpointOut) return;

      try {
        if (!usbDevice.opened) await usbDevice.open();
        try { await usbDevice.claimInterface(interfaceNumber); } catch(e){}

        const dateStr = new Date().toLocaleDateString('en-US');
        const ESC = '\x1B', GS = '\x1D';

        let passData = "";
        passData += ESC + '@' + ESC + '3\x18';
        passData += ESC + 'a\x01' + "MR. CARNEAL'S CLASSROOM\n";
        passData += "--------------------------------\n";
        passData += GS + '!\x11' + "HALL PASS\n" + GS + '!\x00';
        passData += "--------------------------------\n";
        passData += ESC + 'a\x00';
        passData += `STUDENT: ${studentName}\n`;
        passData += `DEST:    ${location}\n`;
        passData += `DATE:    ${dateStr}\n`;
        passData += `TIME:    ${timeStr}\n`;
        passData += ESC + 'a\x01' + "--------------------------------\n";
        passData += '\n\n' + GS + 'V\x41\x00';

        const encoder = new TextEncoder();
        await usbDevice.transferOut(endpointOut.endpointNumber, encoder.encode(passData));
      } catch (err) {
        console.error("Thermal print failed, re-initializing printer:", err);
        autoConnectPrinter();
      }
    }

    function reprintPassDirectly(name, location, time) {
      printPass(name, location, time);
      const statusBox = document.getElementById('statusBox');
      statusBox.className = "status-card success";
      statusBox.innerHTML = `REPRINTED PASS FOR <b>${name}</b>`;
      setTimeout(() => { resetStatusBox(); }, 3000);
    }

    function reprintLastPass() {
      if (!lastPrintedPass) return;
      reprintPassDirectly(lastPrintedPass.name, lastPrintedPass.location, lastPrintedPass.timestamp);
    }

    function selectLoc(element, locName) {
      if (activePasses.length >= 4) {
        showError("LIMIT REACHED: Maximum 4 students out!");
        return;
      }

      if (locName === "Restroom") {
        const restroomCount = activePasses.filter(p => p.location === "Restroom").length;
        if (restroomCount >= 2) {
          showError("LIMIT REACHED: Maximum 2 Bathroom passes!");
          return;
        }
      }

      document.querySelectorAll('.loc-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      selectedLocation = locName;
      document.getElementById('statusBox').className = "status-card";
      document.getElementById('statusBox').innerHTML = `Location: <b>${locName}</b> &nbsp;|&nbsp; Scan Badge to Leave`;
      keepFocus();
    }

    function renderActivePasses() {
      const listElem = document.getElementById('activeList');
      const countElem = document.getElementById('activeCount');
      
      countElem.innerText = activePasses.length;

      if (activePasses.length === 0) {
        listElem.innerHTML = `<span style="color:#666; font-size:2.8vh; text-align:center; margin-top:20px;">No active passes</span>`;
        return;
      }

      listElem.innerHTML = activePasses.map(p => `
        <div class="pass-chip" onclick="reprintPassDirectly('${p.name.replace(/'/g, "\\'")}', '${p.location}', '${p.time}')">
          <div class="name">${p.name}</div>
          <div class="details">
            <span>${p.location}</span>
            <span>${p.time}</span>
          </div>
          <div class="reprint-hint">🖨 Tap to Reprint</div>
        </div>
      `).join('');
    }

    function handleTempId() {
      const studentName = prompt("Enter Student's First and Last Name:");
      if (!studentName || !studentName.trim()) return;

      const tempId = "TEMP-" + Date.now().toString().slice(-6);
      executePassTransaction(tempId, studentName.trim());
    }

    function processPass() {
      const inputField = document.getElementById('manualIdInput');
      let rawId = inputField.value.trim();
      if (!rawId) return;

      executePassTransaction(cleanId(rawId), null);
    }

    function executePassTransaction(studentId, customName) {
      const inputField = document.getElementById('manualIdInput');

      document.getElementById('statusBox').className = "status-card";
      document.getElementById('statusBox').innerText = "Processing...";

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ 
          studentId: studentId, 
          location: selectedLocation,
          customName: customName 
        })
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === "success") {
          if (result.action === "ISSUED") {
            document.getElementById('statusBox').className = "status-card success";
            document.getElementById('statusBox').innerHTML = `PASS ISSUED! <b>${result.name}</b> → ${result.location}`;
            lastPrintedPass = { name: result.name, location: result.location, timestamp: result.timestamp };
            document.getElementById('reprintBtn').disabled = false;
            printPass(result.name, result.location, result.timestamp);
          } 
          else if (result.action === "RETURNED") {
            document.getElementById('statusBox').className = "status-card returned";
            document.getElementById('statusBox').innerHTML = `WELCOME BACK! <b>${result.name}</b> (${result.duration}).`;
          }

          fetchActivePassesFromSheet();
        } else {
          showError("ERROR: " + result.message);
        }

        clearForm();
        setTimeout(() => { resetStatusBox(); }, 2500);
      })
      .catch(err => { showError("NETWORK ERROR: " + err.message); });
    }

    function showError(msg) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = "status-card error";
      statusBox.innerText = msg;
      setTimeout(() => { resetStatusBox(); }, 3000);
    }

    function resetStatusBox() {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = "status-card";
      statusBox.innerHTML = "1. Tap Location &amp; Scan Badge &nbsp;|&nbsp; 2. Scan Again to Return";
      keepFocus();
    }

    document.getElementById('manualIdInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') processPass();
    });
  </script>
</body>
</html>

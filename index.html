<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hall Pass Kiosk</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .kiosk-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0.8vh 1.5vw;
      gap: 0.8vh;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 7vh;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0 10px;
    }

    h1 { font-size: 2.5vh; color: #4dabf7; text-transform: uppercase; white-space: nowrap; }
    .usb-bar { display: flex; align-items: center; gap: 8px; }
    .usb-status { font-weight: bold; font-size: 1.8vh; }
    .usb-status.connected { color: #20c997; }
    .usb-status.disconnected { color: #dc3545; }
    .usb-btn { background: #0d6efd; border: none; color: white; font-weight: bold; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 1.6vh; }

    /* LOCATION GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 0.6vh 0.8vw;
      height: 42vh;
    }

    .loc-btn {
      background: #1e1e1e;
      border: 2px solid #333;
      color: white;
      font-size: 2.1vh;
      font-weight: bold;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .loc-btn.active {
      background: #0d6efd;
      border-color: #6ea8fe;
      box-shadow: 0 0 8px rgba(13, 110, 253, 0.5);
    }

    /* INPUT ROW */
    .input-card {
      height: 14vh;
      display: flex;
      gap: 8px;
    }

    #manualIdInput {
      flex: 1;
      background: #2a2a2a;
      border: 2px solid #444;
      color: #fff;
      font-size: 3vh;
      padding: 0 10px;
      border-radius: 6px;
      text-align: center;
      outline: none;
    }

    .submit-btn {
      background: #198754;
      border: none;
      color: white;
      font-size: 2.5vh;
      font-weight: bold;
      padding: 0 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* STATUS BAR */
    .status-card {
      height: 12vh;
      background: #1e1e1e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 2vh;
      border: 1px solid #444;
      padding: 0 8px;
    }
    .status-card.success { border-color: #198754; background: #0f291e; }
    .status-card.returned { border-color: #0dcaf0; background: #082d38; }
    .status-card.error { border-color: #dc3545; background: #2c0b0e; }

    /* ACTIVE PASSES PANEL */
    .active-panel {
      height: 21vh;
      background: #181818;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 4px 8px;
      display: flex;
      flex-direction: column;
    }

    .active-header {
      font-size: 1.6vh;
      color: #ffc107;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .active-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
    }

    .pass-chip {
      background: #2b2b2b;
      border: 1px solid #ffc107;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 1.7vh;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .pass-chip .time { color: #aaa; font-size: 1.4vh; }
  </style>
</head>
<body onclick="keepFocus()">

  <div class="kiosk-container">
    <header>
      <h1>MR. CARNEAL - HALL PASS</h1>
      <div class="usb-bar">
        <span id="usbStatus" class="usb-status disconnected">PRINTER: Disconnected</span>
        <button type="button" class="usb-btn" onclick="connectPrinter()">Connect</button>
      </div>
    </header>

    <div class="grid">
      <div class="loc-btn" onclick="selectLoc(this, 'Restroom')">Restroom</div>
      <div class="loc-btn" onclick="selectLoc(this, 'Attendance Office')">Attendance</div>
      <div class="loc-btn" onclick="selectLoc(this, 'Teacher\'s Room')">Teacher Room</div>
      <div class="loc-btn" onclick="selectLoc(this, 'Main Office')">Main Office</div>
      <div class="loc-btn" onclick="selectLoc(this, 'Student Services')">Services</div>
      <div class="loc-btn" onclick="selectLoc(this, 'Library')">Library</div>
      <div class="loc-btn" onclick="selectLoc(this, 'Nurse')">Nurse</div>
      <div class="loc-btn" onclick="selectLoc(this, 'Other')">Other</div>
    </div>

    <div class="input-card">
      <input type="text" id="manualIdInput" placeholder="Scan Badge to Leave or Return" autocomplete="off" autofocus>
      <button type="button" class="submit-btn" onclick="processPass()">SUBMIT</button>
    </div>

    <div id="statusBox" class="status-card">
      1. Tap Location &amp; Scan to Leave &nbsp;|&nbsp; 2. Scan Again to Check Back In
    </div>

    <div class="active-panel">
      <div class="active-header">Currently Out (<span id="activeCount">0</span>)</div>
      <div id="activeList" class="active-list">
        <span style="color:#666; font-size:1.6vh;">No active passes</span>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3aNTDlNw2iIIJQc7RaoawkxUveY2kKVkP7v3x0yXGrqnNK0bKiGHFTReRamIKA4PWDA/exec";

    let usbDevice = null;
    let endpointOut = null;
    let selectedLocation = "";
    let activePasses = [];

    function keepFocus() {
      const inputField = document.getElementById('manualIdInput');
      if (document.activeElement !== inputField) {
        inputField.focus();
      }
    }

    // AUTO-CONNECT PRINTER
    window.addEventListener('DOMContentLoaded', async () => {
      keepFocus();
      autoConnectPrinter();
    });

    async function autoConnectPrinter() {
      const statusElem = document.getElementById('usbStatus');
      try {
        const devices = await navigator.usb.getDevices();
        if (devices.length > 0) {
          usbDevice = devices[0];
          await initializePrinter(usbDevice);
        }
      } catch (error) {
        console.error("Auto-connect error:", error);
      }
    }

    async function connectPrinter() {
      const statusElem = document.getElementById('usbStatus');
      try {
        usbDevice = await navigator.usb.requestDevice({ filters: [] });
        await initializePrinter(usbDevice);
      } catch (error) {
        statusElem.className = "usb-status disconnected";
        statusElem.innerText = "PRINTER: " + error.message;
      }
    }

    async function initializePrinter(device) {
      const statusElem = document.getElementById('usbStatus');
      await device.open();
      if (device.configuration === null) await device.selectConfiguration(1);
      await device.claimInterface(0);

      const interfaces = device.configuration.interfaces;
      for (let iface of interfaces) {
        for (let alternate of iface.alternates) {
          let outEp = alternate.endpoints.find(e => e.direction === 'out');
          if (outEp) { endpointOut = outEp; break; }
        }
      }

      statusElem.className = "usb-status connected";
      statusElem.innerText = "PRINTER: Connected ✓";
    }

    // PRINT PASS LOGIC
    async function printPass(studentName, location, timeStr) {
      if (!usbDevice || !endpointOut) return;

      const ESC = '\x1B', GS = '\x1D';
      let passData = ESC + '@' + ESC + 'a\x01' + "MR. CARNEAL'S CLASSROOM\n";
      passData += "================================\n";
      passData += GS + '!\x11' + "HALL PASS\n" + GS + '!\x00';
      passData += "================================\n\n";
      passData += ESC + 'a\x00';
      passData += `STUDENT: ${studentName}\n`;
      passData += `DEST:    ${location}\n`;
      passData += `ISSUED:  ${timeStr}\n\n`;
      passData += ESC + 'a\x01' + "--------------------------------\nValid for one-way return\n================================\n";
      passData += '\n\n\n\n' + GS + 'V\x41\x00';

      const encoder = new TextEncoder();
      try {
        await usbDevice.transferOut(endpointOut.endpointNumber, encoder.encode(passData));
      } catch (err) { console.error("Print failed:", err); }
    }

    function selectLoc(element, locName) {
      document.querySelectorAll('.loc-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      selectedLocation = locName;
      document.getElementById('statusBox').className = "status-card";
      document.getElementById('statusBox').innerHTML = `Location: <b>${locName}</b> &nbsp;|&nbsp; Scan Badge to Issue Pass`;
      keepFocus();
    }

    function renderActivePasses() {
      const listElem = document.getElementById('activeList');
      const countElem = document.getElementById('activeCount');
      
      countElem.innerText = activePasses.length;

      if (activePasses.length === 0) {
        listElem.innerHTML = `<span style="color:#666; font-size:1.6vh;">No active passes</span>`;
        return;
      }

      listElem.innerHTML = activePasses.map(p => `
        <div class="pass-chip">
          <b>${p.name}</b> (${p.location})
          <span class="time">${p.time}</span>
        </div>
      `).join('');
    }

    function processPass() {
      const inputField = document.getElementById('manualIdInput');
      let studentId = inputField.value.trim();

      if (!studentId) return;

      // Check locally if student is already active
      const existingIndex = activePasses.findIndex(p => p.id === studentId);

      // If NOT active and NO location picked, prompt error
      if (existingIndex === -1 && !selectedLocation) {
        document.getElementById('statusBox').className = "status-card error";
        document.getElementById('statusBox').innerText = "ERROR: Tap a location first!";
        return;
      }

      document.getElementById('statusBox').className = "status-card";
      document.getElementById('statusBox').innerText = "Communicating with server...";

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ studentId: studentId, location: selectedLocation })
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === "success") {
          if (result.action === "ISSUED") {
            // Add to active array & print
            activePasses.push({ id: result.studentId, name: result.name, location: result.location, time: result.timestamp });
            document.getElementById('statusBox').className = "status-card success";
            document.getElementById('statusBox').innerHTML = `PASS ISSUED! <b>${result.name}</b> → ${result.location}`;
            printPass(result.name, result.location, result.timestamp);
          } 
          else if (result.action === "RETURNED") {
            // Remove from active array
            activePasses = activePasses.filter(p => p.id !== result.studentId);
            document.getElementById('statusBox').className = "status-card returned";
            document.getElementById('statusBox').innerHTML = `WELCOME BACK! <b>${result.name}</b> checked in.`;
          }

          renderActivePasses();
        } else {
          document.getElementById('statusBox').className = "status-card error";
          document.getElementById('statusBox').innerText = "ERROR: " + result.message;
        }

        inputField.value = '';
        selectedLocation = "";
        document.querySelectorAll('.loc-btn').forEach(btn => btn.classList.remove('active'));

        setTimeout(() => {
          document.getElementById('statusBox').className = "status-card";
          document.getElementById('statusBox').innerHTML = "1. Tap Location &amp; Scan to Leave &nbsp;|&nbsp; 2. Scan Again to Check Back In";
          keepFocus();
        }, 3000);
      })
      .catch(err => {
        document.getElementById('statusBox').className = "status-card error";
        document.getElementById('statusBox').innerText = "NETWORK ERROR: " + err.message;
      });
    }

    document.getElementById('manualIdInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') processPass();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hall Pass Kiosk</title>
  
  <!-- Web App Manifest for Full-Screen Mode (Hides Address Bar) -->
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Hall%20Pass%20Kiosk%22,%22short_name%22:%22HallPass%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23121212%22,%22theme_color%22:%22%23121212%22}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* MAIN CONTAINER: SIDE-BY-SIDE SPLIT */
    .kiosk-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 0.8vh 1vw;
      gap: 1vw;
    }

    /* LEFT SIDE: 75% WIDTH */
    .left-side {
      width: 75%;
      display: flex;
      flex-direction: column;
      gap: 0.8vh;
    }

    /* RIGHT SIDE: 25% WIDTH */
    .right-side {
      width: 25%;
      background: #181818;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 10vh;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0 12px;
    }

    h1 { font-size: 3.5vh; color: #4dabf7; text-transform: uppercase; white-space: nowrap; font-weight: 900; }
    .usb-bar { display: flex; align-items: center; gap: 8px; }
    .usb-status { font-weight: bold; font-size: 2.2vh; }
    .usb-status.connected { color: #20c997; }
    .usb-status.disconnected { color: #dc3545; }
    .usb-btn { background: #0d6efd; border: none; color: white; font-weight: bold; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 2vh; }

    /* LOCATION GRID (2x4) */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 0.8vh 0.8vw;
      height: 52vh;
    }

    .loc-btn {
      background: #1e1e1e;
      border: 2px solid #444;
      color: white;
      font-size: 3vh;
      font-weight: 800;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .loc-btn.active {
      background: #0d6efd;
      border-color: #6ea8fe;
      box-shadow: 0 0 12px rgba(13, 110, 253, 0.7);
    }

    /* INPUT ROW */
    .input-card {
      height: 18vh;
      display: flex;
      gap: 8px;
    }

    #manualIdInput {
      flex: 1;
      background: #2a2a2a;
      border: 2px solid #555;
      color: #fff;
      font-size: 4vh;
      font-weight: bold;
      padding: 0 12px;
      border-radius: 6px;
      text-align: center;
      outline: none;
    }

    .submit-btn {
      background: #198754;
      border: none;
      color: white;
      font-size: 3.5vh;
      font-weight: 900;
      padding: 0 24px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* STATUS BAR */
    .status-card {
      height: 16vh;
      background: #1e1e1e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 2.8vh;
      font-weight: bold;
      border: 2px solid #444;
      padding: 0 8px;
    }
    .status-card.success { border-color: #198754; background: #0f291e; }
    .status-card.returned { border-color: #0dcaf0; background: #082d38; }
    .status-card.error { border-color: #dc3545; background: #2c0b0e; }

    /* RIGHT SIDE: ACTIVE PASSES */
    .active-header {
      font-size: 2.5vh;
      color: #ffc107;
      font-weight: 900;
      text-transform: uppercase;
      padding-bottom: 6px;
      border-bottom: 2px solid #333;
      margin-bottom: 8px;
      text-align: center;
    }

    .active-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
    }

    .pass-chip {
      background: #2b2b2b;
      border: 2px solid #ffc107;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pass-chip .name { font-size: 2.3vh; font-weight: bold; color: #fff; }
    .pass-chip .details { font-size: 1.8vh; color: #bbb; display: flex; justify-content: space-between; }
  </style>
</head>
<body onclick="keepFocus()">

  <div class="kiosk-container">
    
    <!-- LEFT SIDE: 75% WIDTH -->
    <div class="left-side">
      <header>
        <h1>MR. CARNEAL - HALL PASS</h1>
        <div class="usb-bar">
          <span id="usbStatus" class="usb-status disconnected">PRINTER: Disconnected</span>
          <button type="button" class="usb-btn" onclick="connectPrinter()">Connect</button>
        </div>
      </header>

      <div class="grid">
        <div class="loc-btn" onclick="selectLoc(this, 'Restroom')">Restroom</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Attendance Office')">Attendance</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Teacher\'s Room')">Teacher Room</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Main Office')">Main Office</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Student Services')">Services</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Library')">Library</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Nurse')">Nurse</div>
        <div class="loc-btn" onclick="selectLoc(this, 'Other')">Other</div>
      </div>

      <div class="input-card">
        <input type="text" id="manualIdInput" placeholder="Scan Badge to Leave or Return" autocomplete="off" autofocus>
        <button type="button" class="submit-btn" onclick="processPass()">SUBMIT</button>
      </div>

      <div id="statusBox" class="status-card">
        1. Tap Location &amp; Scan Badge &nbsp;|&nbsp; 2. Scan Again to Check Back In
      </div>
    </div>

    <!-- RIGHT SIDE: 25% WIDTH -->
    <div class="right-side">
      <div class="active-header">CURRENTLY OUT (<span id="activeCount">0</span>)</div>
      <div id="activeList" class="active-list">
        <span style="color:#666; font-size:2vh; text-align:center; margin-top:10px;">No active passes</span>
      </div>
    </div>

  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3aNTDlNw2iIIJQc7RaoawkxUveY2kKVkP7v3x0yXGrqnNK0bKiGHFTReRamIKA4PWDA/exec";

    let usbDevice = null;
    let endpointOut = null;
    let selectedLocation = "";
    let activePasses = [];

    function keepFocus() {
      const inputField = document.getElementById('manualIdInput');
      if (document.activeElement !== inputField) {
        inputField.focus();
      }
    }

    // AUTO-CONNECT PRINTER
    window.addEventListener('DOMContentLoaded', async () => {
      keepFocus();
      autoConnectPrinter();
    });

    async function autoConnectPrinter() {
      const statusElem = document.getElementById('usbStatus');
      try {
        const devices = await navigator.usb.getDevices();
        if (devices.length > 0) {
          usbDevice = devices[0];
          await initializePrinter(usbDevice);
        }
      } catch (error) {
        console.error("Auto-connect error:", error);
      }
    }

    async function connectPrinter() {
      const statusElem = document.getElementById('usbStatus');
      try {
        usbDevice = await navigator.usb.requestDevice({ filters: [] });
        await initializePrinter(usbDevice);
      } catch (error) {
        statusElem.className = "usb-status disconnected";
        statusElem.innerText = "PRINTER: " + error.message;
      }
    }

    async function initializePrinter(device) {
      const statusElem = document.getElementById('usbStatus');
      await device.open();
      if (device.configuration === null) await device.selectConfiguration(1);
      await device.claimInterface(0);

      const interfaces = device.configuration.interfaces;
      for (let iface of interfaces) {
        for (let alternate of iface.alternates) {
          let outEp = alternate.endpoints.find(e => e.direction === 'out');
          if (outEp) { endpointOut = outEp; break; }
        }
      }

      statusElem.className = "usb-status connected";
      statusElem.innerText = "PRINTER: Connected ✓";
    }

    // PRINT PASS LOGIC WITH DATE & TIME
    async function printPass(studentName, location, timeStr) {
      if (!usbDevice || !endpointOut) return;

      const dateStr = new Date().toLocaleDateString('en-US'); // Date Stamp (MM/DD/YYYY)

      const ESC = '\x1B', GS = '\x1D';
      let passData = ESC + '@' + ESC + 'a\x01' + "MR. CARNEAL'S CLASSROOM\n";
      passData += "================================\n";
      passData += GS + '!\x11' + "HALL PASS\n" + GS + '!\x00';
      passData += "================================\n\n";
      passData += ESC + 'a\x00';
      passData += `STUDENT: ${studentName}\n`;
      passData += `DEST:    ${location}\n`;
      passData += `DATE:    ${dateStr}\n`;
      passData += `TIME:    ${timeStr}\n\n`;
      passData += ESC + 'a\x01' + "--------------------------------\nValid for one-way return\n================================\n";
      passData += '\n\n\n\n' + GS + 'V\x41\x00';

      const encoder = new TextEncoder();
      try {
        await usbDevice.transferOut(endpointOut.endpointNumber, encoder.encode(passData));
      } catch (err) { console.error("Print failed:", err); }
    }

    function selectLoc(element, locName) {
      document.querySelectorAll('.loc-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      selectedLocation = locName;
      document.getElementById('statusBox').className = "status-card";
      document.getElementById('statusBox').innerHTML = `Location: <b>${locName}</b> &nbsp;|&nbsp; Scan Badge to Leave`;
      keepFocus();
    }

    function renderActivePasses() {
      const listElem = document.getElementById('activeList');
      const countElem = document.getElementById('activeCount');
      
      countElem.innerText = activePasses.length;

      if (activePasses.length === 0) {
        listElem.innerHTML = `<span style="color:#666; font-size:2vh; text-align:center; margin-top:10px;">No active passes</span>`;
        return;
      }

      listElem.innerHTML = activePasses.map(p => `
        <div class="pass-chip">
          <div class="name">${p.name}</div>
          <div class="details">
            <span>${p.location}</span>
            <span>${p.time}</span>
          </div>
        </div>
      `).join('');
    }
